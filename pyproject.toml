[project]
name = "cadence-core"
version = "1.1.1"
description = "Neural model for next clinical event prediction from EHR sequences using the Narrative Velocity framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Amir Rouhollahi", email = "arouhollahi@bwh.harvard.edu"},
]
keywords = ["clinical prediction", "EHR", "electronic health records", "deep learning", "MIMIC-IV"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hdbscan>=0.8.41",
    "joblib>=1.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=5.2.3",
    "torch>=2.0.0",
    "umap-learn>=0.5.11",
    "wfdb>=4.3.1",
    "xgboost>=3.2.0",
]

[project.urls]
Homepage = "https://amirrouh.github.io/cadence/"
Documentation = "https://amirrouh.github.io/cadence/"
Repository = "https://github.com/amirrouh/cadence"
"Bug Tracker" = "https://github.com/amirrouh/cadence/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cadence*"]

[tool.setuptools.package-data]
cadence = ["tests/toy_data/*.jsonl", "tests/toy_data/*.npy", "tests/toy_data/*.json"]
